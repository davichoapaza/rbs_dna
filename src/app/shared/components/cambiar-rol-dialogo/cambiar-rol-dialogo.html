<h2 mat-dialog-title>Cambiar Rol de Usuario</h2>
<mat-dialog-content>
  <mat-radio-group [(ngModel)]="rolSeleccionado" class="roles-group">
    @for (rol of data.rolesDisponibles; track rol) {
      <mat-radio-button [value]="rol" class="rol-option">
        {{ rol | titlecase }}
      </mat-radio-button>
    }
  </mat-radio-group>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="rolSeleccionado === data.rolActual"
    (click)="confirmar()"
  >
    Aplicar Cambio
  </button>
</mat-dialog-actions>
